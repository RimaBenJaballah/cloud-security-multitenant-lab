services:

  postgres:
    image: postgres:15-alpine
    container_name: sec-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       tenantdb
      POSTGRES_USER:     dbadmin
      POSTGRES_PASSWORD: labpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbadmin -d tenantdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.4
    container_name: sec-lab-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,secretsmanager
      AWS_DEFAULT_REGION: eu-west-3
      PERSISTENCE: 1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:4566/_localstack/health | grep -q '\"s3\"'"]
      interval: 5s
      timeout: 10s
      retries: 20

  localstack-init:
    image: amazon/aws-cli:latest
    container_name: sec-lab-localstack-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID:                test
      AWS_SECRET_ACCESS_KEY:            test
      AWS_DEFAULT_REGION:               eu-west-3
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    volumes:
      - ./scripts/seed.sh:/seed.sh:ro
    entrypoint: ["/bin/sh", "/seed.sh"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sec-lab-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      AWS_REGION:          eu-west-3
      S3_BUCKET:           sec-lab-data-prod-local
      USE_LOCALSTACK:      "true"
      LOCALSTACK_ENDPOINT: http://localstack:4566
      DB_HOST:             postgres
      DB_PORT:             "5432"
      DB_NAME:             tenantdb
      DB_USER:             dbadmin
      DB_PASSWORD:         labpassword123
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  localstack_data:
